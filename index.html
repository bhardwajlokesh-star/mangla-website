    <!-- Google Analytics 4 (consent-gated — see CookieConsent.jsx).
         Set VITE_GA_ID=G-XXXXXXXXXX in the build environment to enable it;
         without it, no analytics script is loaded. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      // Default consent mode — denied until user accepts in the banner
      gtag('consent', 'default', {
        ad_storage: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500
      });
      (function () {
        var GA_ID = '%VITE_GA_ID%';
        if (!/^G-[A-Z0-9]+$/.test(GA_ID)) return;
        gtag('js', new Date());
        gtag('config', GA_ID, { send_page_view: false });
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(s);
      })();
    </script>
